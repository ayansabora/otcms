services:
  mysql:
    image: mysql:9.7
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: otcms
      MYSQL_USER: otcms
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme_root}
    ports:
      - "3306:3306"
    volumes:
      - otcms_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-changeme_root}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: mysql://otcms:${MYSQL_PASSWORD:-changeme}@mysql:3306/otcms
    ports:
      - "4000:4000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - otcms_documents:/app/storage/documents

  frontend:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  otcms_mysql_data:
  otcms_documents:
